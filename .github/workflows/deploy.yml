name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

# The site is plain static files under public/. The artifact is served verbatim
# (no Jekyll processing), so the .well-known dotfile directory and app-ads.txt
# survive at the site root.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check writing rules (no em or en dashes)
        run: scripts/check-dashes.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
